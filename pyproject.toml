[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--cov=app",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=json:coverage.json",
    "--cov-fail-under=60",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    "app/ui/pages/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "data",
]

[tool.ruff.lint]
# Runtime errors plus selected bugbear and stale-noqa checks.
select = ["E4", "E7", "E9", "F", "B006", "RUF100"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"streamlit_app.py" = ["E402"]
"app/**/__init__.py" = ["F401"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = [
    "app/analysis",
    "app/models",
    "app/planning",
    "app/projects",
    "app/quality",
    "app/reporting/collector.py",
    "app/services",
    "app/integrations/access",
    "app/integrations/orbits",
    "app/tracking",
]
exclude = [
    "data",
    "tests",
]
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
