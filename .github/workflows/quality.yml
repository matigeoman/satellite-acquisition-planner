name: quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -c requirements-lock.txt

      - name: Dependency consistency
        run: python -m pip check

      - name: Unit, integration, and coverage tests
        run: python -m pytest -q

      - name: Enforce critical coverage
        run: python -m scripts.check_coverage coverage.json

      - name: Pyright
        run: pyright

      - name: Ruff
        run: ruff check app tests streamlit_app.py scripts

      - name: Dependency vulnerability audit
        run: python -m pip_audit --strict --progress-spinner off

      - name: Data and scenario check
        run: python -m app.cli check

      - name: Repository audit
        run: python -m app.cli audit --strict

      - name: End-to-end release check
        run: python -m app.cli release-check --algorithm ALL --cp-sat-time-limit 2

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-json
          path: coverage.json
          if-no-files-found: ignore
